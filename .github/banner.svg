<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Source Kit — open provenance core">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1013"/>
      <stop offset="0.55" stop-color="#0E1418"/>
      <stop offset="1" stop-color="#101B22"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EAEEEF"/>
      <stop offset="1" stop-color="#BFD4DE"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#284A5C" stroke-width="0.6" opacity="0.32"/>
    </pattern>
    <radialGradient id="sealGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#74AECB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#74AECB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1279" height="339" fill="none" stroke="#2C4C5E" stroke-width="1" opacity="0.5"/>

  <!-- seal mark -->
  <g transform="translate(150 170)">
    <circle r="86" fill="url(#sealGlow)"/>
    <circle r="66" fill="none" stroke="#74AECB" stroke-width="2.5"/>
    <circle r="54" fill="none" stroke="#3E6377" stroke-width="1" stroke-dasharray="2 5"/>
    <circle r="17" fill="#74AECB"/>
    <path d="M-7 0 l5 6 l10 -13" fill="none" stroke="#0C1013" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="290" y="150" font-family="'Iowan Old Style', Palatino, Georgia, serif" font-size="72" font-weight="600" letter-spacing="-1" fill="url(#ink)">Source Kit</text>
  <text x="293" y="196" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="19" letter-spacing="6" fill="#74AECB">OPEN&#160;&#160;PROVENANCE&#160;&#160;CORE</text>

  <!-- readout motif -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" transform="translate(292 236)">
    <text x="0" y="0" fill="#5E6E6B">$ node tests/stage.mjs &amp;&amp; tsx test-verification.mts</text>
    <text x="0" y="26" fill="#7FBB97">&#8594; 146 passed, 0 failed</text>
  </g>

  <!-- right rule + tagline -->
  <g transform="translate(1130 90)">
    <line x1="0" y1="0" x2="0" y2="160" stroke="#2C4C5E" stroke-width="1"/>
  </g>
  <text x="1152" y="140" font-family="'Iowan Old Style', Palatino, Georgia, serif" font-size="26" font-style="italic" fill="#AEB6B4">Show</text>
  <text x="1152" y="176" font-family="'Iowan Old Style', Palatino, Georgia, serif" font-size="26" font-style="italic" fill="#AEB6B4">your</text>
  <text x="1152" y="212" font-family="'Iowan Old Style', Palatino, Georgia, serif" font-size="26" font-style="italic" fill="#EAEEEF">work.</text>
</svg>
