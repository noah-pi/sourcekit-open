<!-- Source Kit 0.1.0 — the repository banner artwork -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Source Kit — an open cryptographic camera">
  <defs>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E9E66"/>
      <stop offset="1" stop-color="#1B7A4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2E9E66" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2E9E66" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- app canvas -->
  <rect width="1280" height="300" fill="#F6F6F8"/>

  <!-- the seal mark: aperture ring + sealed centre -->
  <g transform="translate(148 150)">
    <circle r="96" fill="url(#glow)"/>
    <circle r="52" fill="none" stroke="url(#seal)" stroke-width="3"/>
    <circle r="40" fill="none" stroke="#1F6B45" stroke-width="1" opacity="0.30" stroke-dasharray="1.5 5"/>
    <circle r="18" fill="url(#seal)"/>
  </g>

  <!-- wordmark -->
  <text x="258" y="132" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="62" font-weight="700" letter-spacing="-2" fill="#1D1D1F">Source Kit</text>
  <text x="261" y="169" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="800" letter-spacing="3.4" fill="#78787D">AN OPEN CRYPTOGRAPHIC CAMERA</text>

  <text x="261" y="213" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="23" font-weight="700" letter-spacing="-0.5" fill="#1D1D1F">Fuck deepfakes. Prove your work.</text>

  <!-- the ladder motif, right -->
  <g transform="translate(1006 84)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">
    <line x1="6" y1="8" x2="6" y2="112" stroke="#E6E6EB" stroke-width="1.5"/>
    <circle cx="6" cy="10"  r="6" fill="#1F6B45"/><text x="24" y="14" fill="#1D1D1F" font-weight="600">Media unchanged</text>
    <circle cx="6" cy="44"  r="6" fill="#1F6B45"/><text x="24" y="48" fill="#1D1D1F" font-weight="600">Signer identified</text>
    <circle cx="6" cy="78"  r="7.5" fill="none" stroke="#1F6B45" stroke-width="2.5"/><circle cx="6" cy="78" r="3.5" fill="#1F6B45"/><text x="24" y="82" fill="#1D1D1F" font-weight="600">Hardware attested</text>
    <circle cx="6" cy="112" r="6" fill="none" stroke="#78787D" stroke-width="1.5"/><text x="24" y="116" fill="#78787D">Time anchored</text>
  </g>
</svg>
