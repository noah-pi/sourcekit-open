# Written with AI assistance. Verification: docs/PROVENANCE.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install ffmpeg (media fixtures)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install c2patool 0.14.0 (independent verifier)
        # The binary below is the independent oracle for every claim this
        # suite makes — it is downloaded, never built here, so its bytes
        # are pinned: sha256 of the exact release tarball, verified BEFORE
        # extraction. Bumping c2patool means updating both numbers.
        env:
          C2PATOOL_SHA256: c635061cb38d32710f5033ceae61f31fd06c7ced1486a18c7ffa2b8fea726592
        run: |
          curl -sL -o c2patool.tar.gz \
            https://github.com/contentauth/c2pa-rs/releases/download/c2patool-v0.14.0/c2patool-v0.14.0-x86_64-unknown-linux-gnu.tar.gz
          echo "$C2PATOOL_SHA256  c2patool.tar.gz" | sha256sum -c -
          tar xzf c2patool.tar.gz
          chmod +x c2patool/c2patool
          ./c2patool/c2patool --version
          echo "C2PATOOL=$PWD/c2patool/c2patool" >> "$GITHUB_ENV"

      - name: Stage the validation lab
        run: node tests/stage.mjs

      - name: Install staged dependencies (exact versions)
        # The staged lab is generated by tests/stage.mjs and carries no
        # committed lockfile — generate it from the staged package.json
        # (every dep pinned exactly there), then let npm ci enforce it.
        run: npm install --package-lock-only --no-audit --no-fund && npm ci --no-audit --no-fund
        working-directory: tests/.staged

      - name: Every suite
        # tests/run-all.mjs discovers test-*.mts in the staged lab, so a new
        # suite runs with nothing to add here. It prints one tally and exits
        # non-zero if any suite does.
        run: node tests/run-all.mjs

  app-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Stage the app core (real code + device shims)
        run: node tests/stage.mjs

      - name: Install staged dependencies
        run: npm install --package-lock-only --no-audit --no-fund && npm ci --no-audit --no-fund
        working-directory: tests/.staged

      - name: Typecheck the staged tree (strict)
        # The staged lab is the app's real shipped code with device services
        # rewired to shims, so that is what gets typechecked.
        run: |
          npm install --no-save --no-audit --no-fund typescript@5.6.3 @types/node@20.14.0
          ./node_modules/.bin/tsc --noEmit --strict --skipLibCheck \
            --target ES2022 --lib ES2022,DOM,DOM.Iterable \
            --module ESNext --moduleResolution bundler \
            --allowImportingTsExtensions --resolveJsonModule \
            $(ls *.mts | grep -v -E '^(test|tool|build)-')
        working-directory: tests/.staged

      - name: Typecheck the app (strict, tsconfig.json)
        # Screens and components, against the versions the lockfile pins.
        # --legacy-peer-deps because the lockfile was generated with it.
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npx tsc --noEmit -p tsconfig.json

  ios-build:
    # The Swift gate. Nothing else in this workflow runs a Swift compiler, so
    # without this job a type error, a bad selector, or a renamed API in
    # modules/ reaches a device build and never reaches CI.
    #
    # It compiles for the simulator, which typechecks every module against the
    # iOS SDK. Multi-cam capture itself needs real hardware and is covered by
    # the on-device soak run, not here. macOS runners are free on public
    # repositories, so this runs on every change rather than behind a filter:
    # a gate that can be skipped is a gate that gets skipped.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Select the newest Xcode on the image
        # The image's default Xcode ships an older Swift than some Expo pods
        # declare in their Package.swift, and SPM resolution refuses to run a
        # package whose tools version is newer than the toolchain. Picking the
        # newest installed Xcode tracks the image without pinning a version
        # that ages out. The listing is printed so a future failure names what
        # the image actually had.
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version

      - name: Install
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Fetch the C2PAC xcframework
        # Not committed. The script checks the download against the SHA-256
        # upstream pins in c2pa-swift's own Package.swift before unpacking.
        run: ./scripts/fetch-c2pa-framework.sh

      - name: Generate the iOS project
        # ios/ is not committed either; prebuild writes it from app.json and
        # the local modules, which is what a real build does.
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        run: pod install
        working-directory: ios

      - name: Compile every Swift module
        # Build only: no signing, no tests, no device. A clean exit means
        # every file under modules/ parses and typechecks against the SDK.
        run: |
          set -euo pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -list
          xcodebuild build \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  dead-code:
    # Catches the class no compiler and no test reaches: a module nothing
    # imports. A component wired to a Settings toggle but rendered by nothing
    # typechecks, passes every suite, and does nothing — this is what names it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Unreferenced files
        # knip.json lists the real entry points: expo-router screens, the
        # server, the scripts, and every module tests/stage.mjs copies into
        # the lab (the lab copies rather than imports, so knip cannot see
        # that reach on its own). Anything outside that graph is unreachable.
        run: npx knip --include files

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Dependency budget (allow-list + caps + lockfiles)
        run: node scripts/check-dependency-budget.mjs

      - name: Audit gate — server
        run: node scripts/check-audit.mjs server

      - name: Audit gate — app
        # Every high or critical advisory fails unless it is declared in the
        # script with the reason it cannot reach the shipped app.
        run: node scripts/check-audit.mjs .
