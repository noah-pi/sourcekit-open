# Written with AI assistance. Verification: docs/PROVENANCE.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install ffmpeg (media fixtures)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install c2patool 0.14.0 (independent verifier)
        # The binary below is the independent oracle for every claim this
        # suite makes — it is downloaded, never built here, so its bytes
        # are pinned: sha256 of the exact release tarball, verified BEFORE
        # extraction. Bumping c2patool means updating both numbers.
        env:
          C2PATOOL_SHA256: c635061cb38d32710f5033ceae61f31fd06c7ced1486a18c7ffa2b8fea726592
        run: |
          curl -sL -o c2patool.tar.gz \
            https://github.com/contentauth/c2pa-rs/releases/download/c2patool-v0.14.0/c2patool-v0.14.0-x86_64-unknown-linux-gnu.tar.gz
          echo "$C2PATOOL_SHA256  c2patool.tar.gz" | sha256sum -c -
          tar xzf c2patool.tar.gz
          chmod +x c2patool/c2patool
          ./c2patool/c2patool --version
          echo "C2PATOOL=$PWD/c2patool/c2patool" >> "$GITHUB_ENV"

      - name: Stage the validation lab
        run: node tests/stage.mjs

      - name: Install staged dependencies (exact versions)
        # The staged lab is generated by tests/stage.mjs and carries no
        # committed lockfile — generate it from the staged package.json
        # (every dep pinned exactly there), then let npm ci enforce it.
        run: npm install --package-lock-only --no-audit --no-fund && npm ci --no-audit --no-fund
        working-directory: tests/.staged

      - name: Verification + forgery-regression suite
        run: ./node_modules/.bin/tsx test-verification.mts
        working-directory: tests/.staged

      - name: Builder/verifier round trip
        run: ./node_modules/.bin/tsx test-roundtrip.mts
        working-directory: tests/.staged

      - name: Reference corpus + two-verifier conformance
        run: ./node_modules/.bin/tsx test-corpus.mts
        working-directory: tests/.staged

      - name: Offline chain
        run: ./node_modules/.bin/tsx test-offline.mts
        working-directory: tests/.staged

      - name: Independent-verifier suite (c2patool)
        run: ./node_modules/.bin/tsx test-070-final.mts
        working-directory: tests/.staged

      - name: BMFF de-identification suite
        run: ./node_modules/.bin/tsx test-bmff-deid.mts
        working-directory: tests/.staged

      - name: Seal-to-desk + Shamir custody suite
        run: ./node_modules/.bin/tsx test-seal.mts
        working-directory: tests/.staged

      - name: Detached-manifest custody suite
        run: ./node_modules/.bin/tsx test-detached.mts
        working-directory: tests/.staged

      - name: PQ dual-signature suite
        run: ./node_modules/.bin/tsx test-pq.mts
        working-directory: tests/.staged

      - name: Wi-Fi claim suite
        run: ./node_modules/.bin/tsx test-wifi.mts
        working-directory: tests/.staged

      - name: Org identity assertion suite
        run: ./node_modules/.bin/tsx test-identity.mts
        working-directory: tests/.staged

      - name: Trust ladder projection suite
        run: ./node_modules/.bin/tsx test-ladder.mts
        working-directory: tests/.staged

      - name: Known hand local-history suite
        run: ./node_modules/.bin/tsx test-known-hand.mts
        working-directory: tests/.staged

      - name: Parser mutation-fuzz suite
        run: ./node_modules/.bin/tsx test-fuzz.mts
        working-directory: tests/.staged

      - name: Trust axis data-model suite
        run: ./node_modules/.bin/tsx test-trust-axis.mts
        working-directory: tests/.staged

      - name: Malleable-bytes pinning suite
        run: ./node_modules/.bin/tsx test-malleability.mts
        working-directory: tests/.staged

      - name: TSA EKU enforcement suite
        run: ./node_modules/.bin/tsx test-tsa-eku.mts
        working-directory: tests/.staged

      - name: Signed-claim binding guard suite
        run: ./node_modules/.bin/tsx test-binding-guard.mts
        working-directory: tests/.staged

      - name: Policy-layer verdict-mapping unit suite
        run: ./node_modules/.bin/tsx test-policy-layer.mts
        working-directory: tests/.staged

      - name: Differential oracle — hand-rolled vs upstream C2PA engine
        run: ./node_modules/.bin/tsx test-oracle.mts
        working-directory: tests/.staged

      - name: Selective-disclosure core suite
        run: ./node_modules/.bin/tsx test-disclosure.mts
        working-directory: tests/.staged

      - name: JUMBF layout parity suite
        run: ./node_modules/.bin/tsx test-jumbf-parity.mts
        working-directory: tests/.staged

      - name: Streamed-chunks v2 per-track binding suite
        run: ./node_modules/.bin/tsx test-streamed-chunks-v2.mts
        working-directory: tests/.staged

      - name: Commit-at-capture disclosure suite
        run: ./node_modules/.bin/tsx test-commit-at-capture.mts
        working-directory: tests/.staged

      - name: Signed pose-trace suite
        run: ./node_modules/.bin/tsx test-posetrace.mts
        working-directory: tests/.staged

      - name: Real FreeTSA token regression suite (stored fixture, no network)
        run: ./node_modules/.bin/tsx test-tsa-real-network.mts
        working-directory: tests/.staged

      - name: Vault disclosure-hygiene suite
        run: ./node_modules/.bin/tsx test-vault-hygiene.mts
        working-directory: tests/.staged

  app-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install app dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck app/ and src/ on the project toolchain
        # The screens and components, on the TypeScript version package.json
        # declares. tests/ is excluded here and typechecked below against the
        # staged tree, where its imports resolve.
        run: npx tsc --noEmit -p tsconfig.json

      - name: Stage the app core (real code + device shims)
        run: node tests/stage.mjs

      - name: Install staged dependencies
        run: npm install --package-lock-only --no-audit --no-fund && npm ci --no-audit --no-fund
        working-directory: tests/.staged

      - name: Typecheck the staged tree (strict)
        # The staged lab is the app's real shipped code with device services
        # rewired to shims, so that is what gets typechecked.
        run: |
          npm install --no-save --no-audit --no-fund typescript@5.6.3 @types/node@20.14.0
          ./node_modules/.bin/tsc --noEmit --strict --skipLibCheck \
            --target ES2022 --lib ES2022,DOM,DOM.Iterable \
            --module ESNext --moduleResolution bundler \
            --allowImportingTsExtensions --resolveJsonModule \
            $(ls *.mts | grep -v -E '^(test|tool|build)-')
        working-directory: tests/.staged

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Dependency budget (allow-list + caps + lockfiles)
        run: node scripts/check-dependency-budget.mjs

      - name: Audit gate — server
        run: node scripts/check-audit.mjs server

      - name: Audit gate — app
        # Every high or critical advisory fails unless it is declared in the
        # script with the reason it cannot reach the shipped app.
        run: node scripts/check-audit.mjs .
