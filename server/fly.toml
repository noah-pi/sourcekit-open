# Deploy: fly launch --no-deploy (from this directory), then follow the README.
# The app name below is a placeholder — `fly launch` will prompt for/assign one.
app = "your-attest-server"   # pick your own name; `fly apps create <name>`
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  REGISTRY_FILE = "/data/registry.json"

# Persistent volume so the device registry survives deploys/restarts.
[mounts]
  source = "verify_data"
  destination = "/data"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "off"     # tiny app; keep one warm so attestation is instant
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"
